server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 5m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  # single-page app: every other path serves index.html
  location / {
    try_files $uri /index.html;
  }
}
